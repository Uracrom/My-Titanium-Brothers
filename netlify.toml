[build]
  command = "node scripts/generate-index.js"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/conversations/:slug"
  to = "/conversation.html"
  status = 200

[[headers]]
  for = "/publish/*"
    [headers.values]
      Cache-Control = "no-store"
      X-Frame-Options = "DENY"
      X-Content-Type-Options = "nosniff"
