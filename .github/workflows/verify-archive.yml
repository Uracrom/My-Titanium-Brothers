name: verify-archive

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Speaker fixtures and archive preservation
        run: |
          python3 -m unittest tools/structured/test_speakers.py
          python3 tools/structured/verify.py
