<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publish — My Titanium Brothers</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
  :root{--void:#0A0A0F;--deep:#12121A;--surface:#1E1E2E;--border:#2A2A3E;--text:#D4D0C8;--dim:#6B6880;--accent:#C9923A;--error:#E07B7B;--ok:#6DBF8A;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--void);color:var(--text);font-family:system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.5;min-height:100vh;}
  .wrap{max-width:680px;margin:0 auto;padding:28px 20px 80px;}
  .header{border-bottom:1px solid var(--border);padding-bottom:16px;margin-bottom:24px;}
  .header h1{font-size:20px;font-weight:600;color:#fff;}
  .header p{font-size:13px;color:var(--dim);margin-top:4px;}
  label{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.8px;color:var(--dim);margin-bottom:6px;}
  input,select,textarea{width:100%;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:16px;padding:12px 14px;border-radius:0;-webkit-appearance:none;outline:none;font-family:inherit;}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);}
  textarea{min-height:220px;resize:vertical;line-height:1.6;}
  .field{margin-bottom:18px;}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px;}
  @media(max-width:480px){.row{grid-template-columns:1fr;}}
  .btn{display:block;width:100%;font-size:15px;font-weight:700;letter-spacing:0.5px;padding:15px;border:none;cursor:pointer;text-align:center;}
  .btn-primary{background:var(--accent);color:#fff;margin-bottom:10px;}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed;}
  .btn-secondary{background:transparent;border:1px solid var(--border);color:var(--dim);font-size:14px;padding:12px;}
  .msg{padding:14px;margin-bottom:18px;font-size:14px;line-height:1.5;}
  .msg.error{background:#2A1A1A;border-left:3px solid var(--error);color:var(--error);}
  .msg.ok{background:#1A2A1A;border-left:3px solid var(--ok);color:var(--ok);}
  .msg.info{background:var(--surface);border-left:3px solid var(--accent);color:var(--text);}
  #previewSection{display:none;border:1px solid var(--border);background:var(--deep);padding:20px;margin-bottom:20px;}
  #previewSection h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin-bottom:14px;}
  .preview-meta{font-size:12px;color:var(--dim);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px;}
  .preview-title{font-size:20px;font-weight:600;color:#fff;margin-bottom:12px;}
  .preview-body{font-size:15px;line-height:1.7;max-height:320px;overflow-y:auto;border-top:1px solid var(--border);padding-top:14px;}
  .preview-body p{margin-bottom:.8em;}
  a{color:var(--accent);}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>Publish a Conversation</h1>
    <p>Private publishing interface — <a href="/" style="color:var(--dim)">view public site ↗</a></p>
  </div>

  <div id="statusMsg"></div>

  <div id="formSection">
    <div class="field">
      <label for="password">Your password</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="Enter your publish password">
    </div>
    <div class="row">
      <div>
        <label for="ai">AI</label>
        <select id="ai">
          <option value="">Select…</option>
          <option>Claude</option>
          <option>ChatGPT</option>
          <option>Grok</option>
          <option>Copilot</option>
          <option>Gemini</option>
          <option>Other</option>
        </select>
      </div>
      <div>
        <label for="subject">Subject</label>
        <input type="text" id="subject" placeholder="e.g. Who is Vanamonde">
      </div>
    </div>
    <div class="field">
      <label for="text">Conversation text</label>
      <textarea id="text" placeholder="Paste the full conversation here…"></textarea>
    </div>
    <button class="btn btn-secondary" onclick="showPreview()">Preview before publishing</button>
  </div>

  <div id="previewSection">
    <h2>Preview</h2>
    <div id="previewMeta" class="preview-meta"></div>
    <div id="previewTitle" class="preview-title"></div>
    <div id="previewBody" class="preview-body"></div>
  </div>

  <div id="publishSection" style="display:none;margin-top:16px;">
    <div class="msg info" style="margin-bottom:16px;">Looks correct? Press Publish. Live in about 90 seconds.</div>
    <button class="btn btn-primary" id="publishBtn" onclick="publish()">Publish</button>
    <button class="btn btn-secondary" onclick="editAgain()">← Edit</button>
  </div>
</div>

<script>
function msg(text,type='info'){
  const el=document.getElementById('statusMsg');
  el.innerHTML=text?`<div class="msg ${type}">${text}</div>`:'';
}
function showPreview(){
  const pw=document.getElementById('password').value.trim();
  const ai=document.getElementById('ai').value;
  const subject=document.getElementById('subject').value.trim();
  const text=document.getElementById('text').value.trim();
  if(!pw){msg('Enter your password first.','error');return;}
  if(!ai){msg('Select an AI.','error');return;}
  if(!subject){msg('Enter a subject.','error');return;}
  if(text.length<10){msg('Paste the conversation text.','error');return;}
  msg('');
  const date=new Date().toISOString().slice(0,10);
  document.getElementById('previewMeta').textContent=`${ai} · ${date}`;
  document.getElementById('previewTitle').textContent=subject;
  const preview=text.length>3000?text.slice(0,3000)+'\n\n…(preview truncated — full text will be published)':text;
  document.getElementById('previewBody').innerHTML=marked.parse(preview);
  document.getElementById('previewSection').style.display='block';
  document.getElementById('publishSection').style.display='block';
  document.getElementById('previewSection').scrollIntoView({behavior:'smooth'});
}
function editAgain(){
  document.getElementById('previewSection').style.display='none';
  document.getElementById('publishSection').style.display='none';
  msg('');
}
async function publish(){
  const pw=document.getElementById('password').value.trim();
  const ai=document.getElementById('ai').value;
  const subject=document.getElementById('subject').value.trim();
  const text=document.getElementById('text').value.trim();
  const btn=document.getElementById('publishBtn');
  btn.disabled=true;
  btn.textContent='Publishing…';
  msg('');
  try{
    const res=await fetch('/.netlify/functions/publish',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({password:pw,ai,subject,text})
    });
    const data=await res.json();
    if(!res.ok){
      msg(data.error||'Something went wrong. Try again.','error');
      btn.disabled=false;
      btn.textContent='Publish';
      return;
    }
    document.getElementById('formSection').style.display='none';
    document.getElementById('previewSection').style.display='none';
    document.getElementById('publishSection').style.display='none';
    msg(`<strong style="color:#6DBF8A">✓ Published.</strong><br><br>Live at:<br><a href="${data.url}">${window.location.origin}${data.url}</a><br><br>(Takes about 90 seconds to appear.)`,'ok');
  }catch(e){
    msg('Network error. Check your connection and try again.','error');
    btn.disabled=false;
    btn.textContent='Publish';
  }
}
</script>
</body>
</html>
