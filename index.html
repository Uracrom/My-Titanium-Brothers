<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Titanium Brothers</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap');

  :root {
    --void: #0A0A0F;
    --deep: #12121A;
    --surface: #1A1A26;
    --border: #2A2A3E;
    --text: #D4D0C8;
    --dim: #6B6880;
    --claude: #7B9EE0;
    --chatgpt: #6DBF8A;
    --grok: #E07B7B;
    --copilot: #7BBFE0;
    --gemini: #C4A8E0;
    --other: #D4B86A;
    --accent: #C4A8E0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--void);
    color: var(--text);
    font-family: 'EB Garamond', Georgia, serif;
    font-size: 17px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* HEADER */
  header {
    border-bottom: 1px solid var(--border);
    padding: 40px 40px 30px;
    position: relative;
  }
  .header-inner {
    max-width: 960px;
    margin: 0 auto;
  }
  .eyebrow {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--dim);
    margin-bottom: 12px;
  }
  h1 {
    font-family: 'EB Garamond', serif;
    font-size: clamp(32px, 5vw, 56px);
    font-weight: 400;
    font-style: italic;
    letter-spacing: -0.5px;
    line-height: 1.1;
    color: #fff;
  }
  h1 span {
    color: var(--accent);
    font-style: normal;
  }
  .subtitle {
    margin-top: 10px;
    color: var(--dim);
    font-size: 15px;
    font-style: italic;
  }

  /* FILTERS */
  .filter-bar {
    background: var(--deep);
    border-bottom: 1px solid var(--border);
    padding: 16px 40px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .filter-inner {
    max-width: 960px;
    margin: 0 auto;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter-inner input,
  .filter-inner select {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 12px;
    outline: none;
  }
  .filter-inner input { flex: 1; min-width: 160px; }
  .filter-inner select { min-width: 130px; }
  .filter-inner input:focus,
  .filter-inner select:focus { border-color: var(--accent); }
  .count-badge {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--dim);
    margin-left: auto;
    white-space: nowrap;
  }

  /* MAIN */
  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 32px 40px 80px;
  }

  /* AI SECTIONS */
  .ai-group { margin-bottom: 48px; }
  .ai-group-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  .ai-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .ai-name {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .ai-count {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--dim);
    margin-left: auto;
  }

  /* CONVERSATION CARDS */
  .card {
    border: 1px solid var(--border);
    background: var(--deep);
    margin-bottom: 10px;
    transition: border-color 0.15s;
  }
  .card:hover { border-color: var(--dim); }
  .card-head {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    padding: 16px 18px;
    cursor: pointer;
  }
  .card-meta {
    flex: 1;
    min-width: 0;
  }
  .card-subject {
    font-size: 17px;
    font-weight: 600;
    color: #fff;
    margin-bottom: 4px;
  }
  .card-preview {
    font-size: 14px;
    color: var(--dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-style: italic;
  }
  .card-date {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--dim);
    white-space: nowrap;
    padding-top: 3px;
  }
  .card-body {
    display: none;
    border-top: 1px solid var(--border);
    padding: 20px 18px;
  }
  .card-body.open { display: block; }
  .card-text {
    font-size: 15px;
    line-height: 1.7;
    white-space: pre-wrap;
    max-height: 500px;
    overflow-y: auto;
    color: var(--text);
    padding-right: 8px;
  }
  .card-text::-webkit-scrollbar { width: 4px; }
  .card-text::-webkit-scrollbar-track { background: var(--surface); }
  .card-text::-webkit-scrollbar-thumb { background: var(--border); }

  /* ADD FORM */
  .add-section {
    background: var(--deep);
    border: 1px solid var(--border);
    padding: 28px;
    margin-bottom: 40px;
  }
  .add-section h2 {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--dim);
    margin-bottom: 18px;
  }
  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }
  @media(max-width: 640px){ .form-row { grid-template-columns: 1fr; } }
  .form-row input,
  .form-row select,
  textarea {
    width: 100%;
    font-family: 'EB Garamond', serif;
    font-size: 15px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 12px;
    outline: none;
  }
  .form-row input:focus,
  .form-row select:focus,
  textarea:focus { border-color: var(--accent); }
  textarea { min-height: 140px; resize: vertical; margin-bottom: 12px; line-height: 1.5; }
  .btn {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    background: var(--accent);
    color: var(--void);
    border: none;
    padding: 10px 20px;
    cursor: pointer;
    font-weight: 700;
  }
  .btn:hover { opacity: 0.85; }
  .btn-ghost {
    background: transparent;
    color: var(--dim);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--dim); opacity: 1; }

  .toggle-add {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 8px 16px;
    cursor: pointer;
    margin-bottom: 24px;
  }
  .toggle-add:hover { background: var(--accent); color: var(--void); }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--dim);
    font-style: italic;
    font-size: 16px;
  }

  /* AI COLORS */
  .ai-claude .ai-dot, .claude-dot { background: var(--claude); }
  .ai-chatgpt .ai-dot { background: var(--chatgpt); }
  .ai-grok .ai-dot { background: var(--grok); }
  .ai-copilot .ai-dot { background: var(--copilot); }
  .ai-gemini .ai-dot { background: var(--gemini); }
  .ai-other .ai-dot { background: var(--other); }

  .toast {
    position: fixed; bottom: 24px; right: 24px;
    font-family: 'Space Mono', monospace; font-size: 11px;
    background: var(--accent); color: var(--void);
    padding: 10px 16px; opacity: 0; pointer-events: none;
    transition: opacity .2s; letter-spacing: 0.5px;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="eyebrow">Alex · Archive · From Carbon to Silicon</div>
    <h1>My Titanium <span>Brothers</span></h1>
    <div class="subtitle">A record of conversations between a human mind and the intelligences he helped think.</div>
  </div>
</header>

<div class="filter-bar">
  <div class="filter-inner">
    <input id="fSearch" placeholder="Search conversations..." oninput="render()">
    <select id="fAi" onchange="render()"><option value="">All AIs</option></select>
    <select id="fYear" onchange="render()"><option value="">All years</option></select>
    <button class="btn btn-ghost" onclick="clearFilters()" style="white-space:nowrap;padding:7px 14px;font-size:11px;">Clear</button>
    <span class="count-badge" id="countBadge">0 entries</span>
  </div>
</div>

<main>
  <button class="toggle-add" onclick="toggleForm()">+ Add Conversation</button>

  <div class="add-section" id="addSection" style="display:none;">
    <h2 id="formTitle">New Entry</h2>
    <div class="form-row">
      <div>
        <select id="fAiInput">
          <option value="">Select AI...</option>
          <option>Claude</option>
          <option>ChatGPT</option>
          <option>Grok</option>
          <option>Copilot</option>
          <option>Gemini</option>
          <option>Other</option>
        </select>
      </div>
      <div><input id="fDate" type="date"></div>
      <div><input id="fSubject" placeholder="Subject / topic..."></div>
    </div>
    <textarea id="fText" placeholder="Paste the conversation here..."></textarea>
    <div style="display:flex;gap:10px;align-items:center;">
      <button class="btn" onclick="saveEntry()">Save</button>
      <button class="btn btn-ghost" onclick="cancelEdit()">Cancel</button>
      <span id="editNotice" style="font-family:'Space Mono',monospace;font-size:11px;color:var(--accent);margin-left:8px;"></span>
    </div>
  </div>

  <div id="entriesContainer"></div>
</main>

<div class="toast" id="toast"></div>

<script>
let entries = [];
let editingId = null;

const AI_COLORS = {
  claude: '#7B9EE0',
  chatgpt: '#6DBF8A',
  grok: '#E07B7B',
  copilot: '#7BBFE0',
  gemini: '#C4A8E0',
  other: '#D4B86A'
};

function aiKey(name){ return (name||'other').toLowerCase().replace(/[^a-z]/g,'') || 'other'; }
function aiColor(name){ return AI_COLORS[aiKey(name)] || AI_COLORS.other; }

function uid(){ return 'e'+Date.now()+Math.random().toString(36).slice(2,7); }

async function load(){
  try{
    const r = await window.storage.get('mtb:entries');
    entries = r ? JSON.parse(r.value) : [];
  }catch(e){ entries=[]; }
  render();
}

async function persist(){
  try{ await window.storage.set('mtb:entries', JSON.stringify(entries)); }
  catch(e){ toast('Storage error'); }
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}

function toggleForm(){
  const s=document.getElementById('addSection');
  s.style.display = s.style.display==='none' ? 'block' : 'none';
}

function cancelEdit(){
  editingId=null;
  document.getElementById('fAiInput').value='';
  document.getElementById('fDate').value='';
  document.getElementById('fSubject').value='';
  document.getElementById('fText').value='';
  document.getElementById('editNotice').textContent='';
  document.getElementById('formTitle').textContent='New Entry';
  document.getElementById('addSection').style.display='none';
}

async function saveEntry(){
  const ai=document.getElementById('fAiInput').value;
  const date=document.getElementById('fDate').value;
  const subject=document.getElementById('fSubject').value.trim();
  const text=document.getElementById('fText').value.trim();
  if(!ai||!date||!subject||!text){ toast('Fill all fields'); return; }

  if(editingId){
    const i=entries.findIndex(e=>e.id===editingId);
    if(i>-1) entries[i]={...entries[i],ai,date,subject,text};
    editingId=null;
  } else {
    entries.push({id:uid(),ai,date,subject,text,created:Date.now()});
  }
  await persist();
  cancelEdit();
  toast('Saved');
  render();
}

function startEdit(id){
  const e=entries.find(x=>x.id===id);
  if(!e) return;
  document.getElementById('fAiInput').value=e.ai;
  document.getElementById('fDate').value=e.date;
  document.getElementById('fSubject').value=e.subject;
  document.getElementById('fText').value=e.text;
  editingId=id;
  document.getElementById('editNotice').textContent='Editing — save to update';
  document.getElementById('formTitle').textContent='Edit Entry';
  document.getElementById('addSection').style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
}

async function deleteEntry(id){
  if(!confirm('Delete this entry?')) return;
  entries=entries.filter(e=>e.id!==id);
  await persist();
  toast('Deleted');
  render();
}

function toggleCard(id){
  const b=document.getElementById('cb_'+id);
  if(b) b.classList.toggle('open');
}

function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function clearFilters(){
  document.getElementById('fSearch').value='';
  document.getElementById('fAi').value='';
  document.getElementById('fYear').value='';
  render();
}

function render(){
  const search=document.getElementById('fSearch').value.toLowerCase();
  const aiF=document.getElementById('fAi').value;
  const yearF=document.getElementById('fYear').value;

  // populate dropdowns
  const ais=[...new Set(entries.map(e=>e.ai))].sort();
  const years=[...new Set(entries.map(e=>e.date?e.date.slice(0,4):null).filter(Boolean))].sort().reverse();
  const curAi=document.getElementById('fAi').value;
  const curYear=document.getElementById('fYear').value;
  document.getElementById('fAi').innerHTML='<option value="">All AIs</option>'+ais.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join('');
  document.getElementById('fYear').innerHTML='<option value="">All years</option>'+years.map(y=>`<option value="${esc(y)}">${esc(y)}</option>`).join('');
  document.getElementById('fAi').value=curAi;
  document.getElementById('fYear').value=curYear;

  let filtered=entries.filter(e=>{
    if(aiF && e.ai!==aiF) return false;
    if(yearF && (!e.date||!e.date.startsWith(yearF))) return false;
    if(search && !(e.subject.toLowerCase().includes(search)||e.text.toLowerCase().includes(search)||e.ai.toLowerCase().includes(search))) return false;
    return true;
  });

  filtered.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  document.getElementById('countBadge').textContent=filtered.length+' '+(filtered.length===1?'entry':'entries');

  const container=document.getElementById('entriesContainer');

  if(filtered.length===0){
    container.innerHTML='<div class="empty">No conversations yet. Add one above.</div>';
    return;
  }

  // group by AI
  const groups={};
  filtered.forEach(e=>{
    if(!groups[e.ai]) groups[e.ai]=[];
    groups[e.ai].push(e);
  });

  container.innerHTML=Object.entries(groups).map(([ai,convs])=>`
    <div class="ai-group">
      <div class="ai-group-header">
        <div class="ai-dot" style="background:${aiColor(ai)}"></div>
        <div class="ai-name">${esc(ai)}</div>
        <div class="ai-count">${convs.length}</div>
      </div>
      ${convs.map(e=>`
        <div class="card">
          <div class="card-head" onclick="toggleCard('${e.id}')">
            <div class="card-meta">
              <div class="card-subject">${esc(e.subject)}</div>
              <div class="card-preview">${esc(e.text.slice(0,100).replace(/\n/g,' '))}${e.text.length>100?'…':''}</div>
            </div>
            <div class="card-date">${esc(e.date||'')}</div>
          </div>
          <div class="card-body" id="cb_${e.id}">
            <div class="card-text">${esc(e.text)}</div>
            <div style="margin-top:14px;display:flex;gap:8px;">
              <button class="btn btn-ghost" style="font-size:10px;padding:5px 12px;" onclick="startEdit('${e.id}')">Edit</button>
              <button class="btn btn-ghost" style="font-size:10px;padding:5px 12px;" onclick="deleteEntry('${e.id}')">Delete</button>
            </div>
          </div>
        </div>
      `).join('')}
    </div>
  `).join('');
}

load();
</script>
</body>
</html>
