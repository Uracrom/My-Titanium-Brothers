<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Titanium Brothers</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap');
:root{--void:#0A0A0F;--border:#2A2A3E;--text:#D4D0C8;--dim:#6B6880;--accent:#C9923A;--claude:#7B9EE0;--chatgpt:#6DBF8A;--grok:#E07B7B;--copilot:#7BBFE0;--gemini:#C4A8E0;--deepseek:#A8D8A8;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--void);color:var(--text);font-family:'EB Garamond',Georgia,serif;font-size:18px;line-height:1.7;}
header{border-bottom:1px solid var(--border);padding:36px 32px 24px;}
.eyebrow{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--dim);margin-bottom:10px;}
h1{font-family:'EB Garamond',serif;font-size:clamp(28px,5vw,50px);font-weight:400;font-style:italic;color:#fff;line-height:1.1;}
h1 span{color:var(--accent);font-style:normal;}
.sub{margin-top:8px;color:var(--dim);font-style:italic;font-size:15px;}
main{max-width:760px;margin:0 auto;padding:40px 32px 80px;}
a.btn{display:flex;align-items:center;gap:14px;font-family:'EB Garamond',serif;font-size:22px;color:var(--text);text-decoration:none;padding:18px 4px;border-bottom:1px solid var(--border);transition:color .15s;}
a.btn:hover{color:var(--accent);}
.dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
@media(max-width:600px){header,main{padding-left:20px;padding-right:20px;}}
</style>
</head>
<body>
<header>
  <div class="eyebrow">Alex · Archive · From Carbon to Silicon</div>
  <h1>My Titanium <span>Brothers</span></h1>
  <div class="sub">A record of conversations between a human mind and the intelligences he helped think.</div>
</header>
<main>
  <a class="btn" href="claude.html"><div class="dot" style="background:var(--claude)"></div>Claude</a>
  <a class="btn" href="chatgpt.html"><div class="dot" style="background:var(--chatgpt)"></div>ChatGPT</a>
  <a class="btn" href="grok.html"><div class="dot" style="background:var(--grok)"></div>Grok</a>
  <a class="btn" href="copilot.html"><div class="dot" style="background:var(--copilot)"></div>Copilot</a>
  <a class="btn" href="gemini.html"><div class="dot" style="background:var(--gemini)"></div>Gemini</a>
  <a class="btn" href="deepseek.html"><div class="dot" style="background:var(--deepseek)"></div>DeepSeek</a>
</main>
<script data-goatcounter="https://uracrom.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
