<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Titanium Brothers</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap');
  :root{
    --void:#0A0A0F;--deep:#12121A;--border:#2A2A3E;
    --text:#D4D0C8;--dim:#6B6880;--accent:#C9923A;
    --claude:#7B9EE0;--chatgpt:#6DBF8A;--grok:#E07B7B;
    --copilot:#7BBFE0;--gemini:#C4A8E0;--other:#D4B86A;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--void);color:var(--text);font-family:'EB Garamond',Georgia,serif;font-size:17px;line-height:1.6;}
  header{border-bottom:1px solid var(--border);padding:40px 40px 28px;}
  .inner{max-width:820px;margin:0 auto;}
  .eyebrow{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--dim);margin-bottom:10px;}
  h1{font-family:'EB Garamond',serif;font-size:clamp(30px,5vw,52px);font-weight:400;font-style:italic;color:#fff;line-height:1.1;}
  h1 span{color:var(--accent);font-style:normal;}
  .sub{margin-top:8px;color:var(--dim);font-style:italic;font-size:15px;}
  main{max-width:820px;margin:0 auto;padding:36px 40px 80px;}
  .ai-block{margin-bottom:44px;}
  .ai-head{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:14px;}
  .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .ai-label{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:1px;text-transform:uppercase;}
  .ai-count{font-family:'Space Mono',monospace;font-size:11px;color:var(--dim);margin-left:auto;}
  ul{list-style:none;}
  li{border-bottom:1px solid var(--border);}
  li:last-child{border-bottom:none;}
  a.entry{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:11px 2px;text-decoration:none;color:var(--text);transition:color .15s;}
  a.entry:hover{color:var(--accent);}
  .entry-title{font-size:17px;}
  .entry-date{font-family:'Space Mono',monospace;font-size:11px;color:var(--dim);white-space:nowrap;flex-shrink:0;}
  .empty{font-style:italic;color:var(--dim);font-size:15px;padding:8px 2px;}
  .loading{text-align:center;padding:60px;color:var(--dim);font-style:italic;}
  @media(max-width:600px){header,main{padding-left:20px;padding-right:20px;}}
</style>
</head>
<body>
<header>
  <div class="inner">
    <div class="eyebrow">Alex · Archive · From Carbon to Silicon</div>
    <h1>My Titanium <span>Brothers</span></h1>
    <div class="sub">A record of conversations between a human mind and the intelligences he helped think.</div>
  </div>
</header>
<main class="inner">
  <div id="content"><div class="loading">Loading conversations…</div></div>
</main>
<script>
const AI_ORDER = ['Claude','ChatGPT','Grok','Copilot','Gemini','Other'];
const AI_COLOR = {claude:'#7B9EE0',chatgpt:'#6DBF8A',grok:'#E07B7B',copilot:'#7BBFE0',gemini:'#C4A8E0',other:'#D4B86A'};
function color(ai){ return AI_COLOR[(ai||'').toLowerCase().replace(/[^a-z]/g,'')] || AI_COLOR.other; }
function esc(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

fetch('index.json')
  .then(r=>r.ok?r.json():Promise.reject('No index'))
  .then(({conversations=[]})=>{
    if(!conversations.length){
      document.getElementById('content').innerHTML='<div class="empty" style="padding:60px 0;text-align:center;">No conversations published yet.</div>';
      return;
    }
    const groups={};
    conversations.forEach(c=>{
      const key=c.ai||'Other';
      if(!groups[key]) groups[key]=[];
      groups[key].push(c);
    });
    const order=[...AI_ORDER,...Object.keys(groups).filter(k=>!AI_ORDER.includes(k))];
    document.getElementById('content').innerHTML = order.filter(ai=>groups[ai]?.length).map(ai=>{
      const convs=groups[ai].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
      return `<div class="ai-block">
        <div class="ai-head">
          <div class="dot" style="background:${color(ai)}"></div>
          <div class="ai-label">${esc(ai)}</div>
          <div class="ai-count">${convs.length}</div>
        </div>
        <ul>${convs.map(c=>`<li><a class="entry" href="conversations/${esc(c.slug)}">
          <span class="entry-title">${esc(c.title)}</span>
          <span class="entry-date">${esc(c.date)}</span>
        </a></li>`).join('')}</ul>
      </div>`;
    }).join('');
  })
  .catch(()=>{
    document.getElementById('content').innerHTML='<div class="empty" style="padding:60px 0;text-align:center;">No conversations yet.</div>';
  });
</script>
</body>
</html>
