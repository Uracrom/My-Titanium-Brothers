<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Titanium Brothers</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap');
:root{--void:#0A0A0F;--border:#2A2A3E;--text:#D4D0C8;--dim:#6B6880;--accent:#C9923A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--void);color:var(--text);font-family:'EB Garamond',Georgia,serif;font-size:18px;line-height:1.7;}
header{border-bottom:1px solid var(--border);padding:36px 32px 24px;}
.eyebrow{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--dim);margin-bottom:10px;}
h1{font-family:'EB Garamond',serif;font-size:clamp(24px,4vw,40px);font-weight:400;color:#fff;line-height:1.2;}
.meta{font-family:'Space Mono',monospace;font-size:11px;color:var(--dim);margin-top:8px;}
main{max-width:760px;margin:0 auto;padding:40px 32px 80px;}
a.back{font-family:'Space Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);text-decoration:none;display:inline-block;margin-bottom:32px;}
a.back:hover{color:var(--accent);}
.convo-text{white-space:pre-wrap;font-size:17px;line-height:1.8;color:var(--text);}
.loading{font-style:italic;color:var(--dim);}
@media(max-width:600px){header,main{padding-left:20px;padding-right:20px;}}
.csbar{position:sticky;top:0;z-index:50;background:rgba(10,10,15,.96);border-bottom:1px solid var(--border);padding:8px 12px;display:flex;gap:6px;align-items:center;justify-content:center;}
.csbar input{flex:1;max-width:420px;min-width:0;background:#12121a;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:7px 8px;font-family:'Space Mono',monospace;font-size:12px;}
.csbar input:focus{outline:none;border-color:var(--accent);}
.csbar button{background:none;border:1px solid var(--border);color:var(--text);border-radius:6px;min-width:32px;height:32px;font-size:15px;cursor:pointer;}
.csbar button:hover{border-color:var(--accent);color:var(--accent);}
.csbar .cscount{font-family:'Space Mono',monospace;font-size:11px;color:var(--dim);min-width:58px;text-align:center;white-space:nowrap;}
mark.csm{background:rgba(201,146,58,.28);color:inherit;border-radius:2px;}
mark.csm.cur{background:#C9923A;color:#0A0A0F;}
.csbar .csmode{display:inline-flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;flex:none;}
.csbar .csmode button{border:none;border-radius:0;min-width:0;height:32px;padding:0 7px;font-family:'Space Mono',monospace;font-size:10px;color:var(--dim);}
.csbar .csmode button[aria-pressed="true"]{background:var(--accent);color:#0A0A0F;}
mark.csr{background:rgba(120,170,220,.18);color:inherit;border-radius:2px;border-bottom:1px dashed rgba(120,170,220,.7);}
mark.csr.cur{background:#78AADC;color:#0A0A0F;}
@media(max-width:420px){.csbar{gap:4px;padding:8px 6px;}.csbar .cscount{min-width:44px;}.csbar button{min-width:28px;}}
</style>
</head>
<body>

  <div class="eyebrow" id="aiName">My Titanium Brothers</div>
  <h1 id="title">Loading…</h1>
  <div class="meta" id="date"></div>
</header>

<main>
  <a class="back" href="#" id="backLink">← Back</a>
  <div class="convo-text" id="text"><div class="loading">Loading conversation…</div></div>
</main>

  const db = getFirestore(app);

    document.getElementById('text').textContent = '';

    document.getElementById('backLink').href = col + '.html';

      document.getElementById('title').textContent = d.title;
      document.getElementById('date').textContent = d.date;
      document.getElementById('text').textContent = d.text;

  }
</script>
