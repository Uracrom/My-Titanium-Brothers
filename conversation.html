<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Titanium Brothers</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap');
:root{--void:#0A0A0F;--border:#2A2A3E;--text:#D4D0C8;--dim:#6B6880;--accent:#C9923A;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--void);color:var(--text);font-family:'EB Garamond',Georgia,serif;font-size:18px;line-height:1.7;}
header{border-bottom:1px solid var(--border);padding:36px 32px 24px;}
.eyebrow{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--dim);margin-bottom:10px;}
h1{font-family:'EB Garamond',serif;font-size:clamp(24px,4vw,40px);font-weight:400;color:#fff;line-height:1.2;}
.meta{font-family:'Space Mono',monospace;font-size:11px;color:var(--dim);margin-top:8px;}
main{max-width:760px;margin:0 auto;padding:40px 32px 80px;}
a.back{font-family:'Space Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);text-decoration:none;display:inline-block;margin-bottom:32px;}
a.back:hover{color:var(--accent);}
.convo-text{white-space:pre-wrap;font-size:17px;line-height:1.8;color:var(--text);}
.loading{font-style:italic;color:var(--dim);}
@media(max-width:600px){header,main{padding-left:20px;padding-right:20px;}}
.csbar{position:sticky;top:0;z-index:50;background:rgba(10,10,15,.96);border-bottom:1px solid var(--border);padding:8px 12px;display:flex;gap:6px;align-items:center;justify-content:center;}
.csbar input{flex:1;max-width:420px;min-width:0;background:#12121a;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:7px 8px;font-family:'Space Mono',monospace;font-size:12px;}
.csbar input:focus{outline:none;border-color:var(--accent);}
.csbar button{background:none;border:1px solid var(--border);color:var(--text);border-radius:6px;min-width:32px;height:32px;font-size:15px;cursor:pointer;}
.csbar button:hover{border-color:var(--accent);color:var(--accent);}
.csbar .cscount{font-family:'Space Mono',monospace;font-size:11px;color:var(--dim);min-width:58px;text-align:center;white-space:nowrap;}
mark.csm{background:rgba(201,146,58,.28);color:inherit;border-radius:2px;}
mark.csm.cur{background:#C9923A;color:#0A0A0F;}
</style>
</head>
<body>
<header>
  <div class="eyebrow" id="aiName">My Titanium Brothers</div>
  <h1 id="title">Loading…</h1>
  <div class="meta" id="date"></div>
</header>
<div class="csbar" id="csBar" role="search"><input id="csIn" type="search" placeholder="Search this conversation" aria-label="Search this conversation" autocomplete="off"><span class="cscount" id="csCount"></span><button type="button" id="csPrev" aria-label="Previous match">&#8593;</button><button type="button" id="csNext" aria-label="Next match">&#8595;</button><button type="button" id="csClr" aria-label="Clear search">&#215;</button></div>
<main>
  <a class="back" href="#" id="backLink">← Back</a>
  <div class="convo-text" id="text"><div class="loading">Loading conversation…</div></div>
</main>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC-fZizak_8hTs8lg1DqiXtTQjK9pYH_SQ",
    authDomain: "my-titanium-brothers.firebaseapp.com",
    projectId: "my-titanium-brothers",
    storageBucket: "my-titanium-brothers.firebasestorage.app",
    messagingSenderId: "403214601863",
    appId: "1:403214601863:web:3c1c71f2289b564da27222"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const col = params.get('col');

  if(!id || !col){
    document.getElementById('title').textContent = 'Conversation not found';
    document.getElementById('text').textContent = '';
  } else {
    document.getElementById('backLink').href = col + '.html';
    getDoc(doc(db, col, id)).then(snap => {
      if(!snap.exists()){
        document.getElementById('title').textContent = 'Not found';
        document.getElementById('text').textContent = '';
        return;
      }
      const d = snap.data();
      document.title = d.title + ' — My Titanium Brothers';
      document.getElementById('aiName').textContent = d.ai || col;
      document.getElementById('title').textContent = d.title;
      document.getElementById('date').textContent = d.date;
      document.getElementById('text').textContent = d.text;
    });
  }
</script>
<script>
(function(){
  var box=document.getElementById('text'),inp=document.getElementById('csIn'),cnt=document.getElementById('csCount');
  var mo,lastQ='',raw=null,norm='',marks=[],cur=-1,busy=false;
  function nz(c){var n=c.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();return n.length===1?n:c.toLowerCase().charAt(0)||c;}
  function prep(){raw=box.textContent;var a=[];for(var i=0;i<raw.length;i++)a.push(nz(raw[i]));norm=a.join('');}
  function render(){
    if(raw===null)return;busy=true;
    var q=inp.value;lastQ=q;var qn='';for(var i=0;i<q.length;i++)qn+=nz(q[i]);
    box.textContent='';marks=[];cur=-1;
    if(!qn.trim()){box.textContent=raw;cnt.textContent='';mo.takeRecords();busy=false;return;}
    var frag=document.createDocumentFragment(),pos=0,idx;
    while((idx=norm.indexOf(qn,pos))!==-1){
      if(idx>pos)frag.appendChild(document.createTextNode(raw.slice(pos,idx)));
      var m=document.createElement('mark');m.className='csm';m.textContent=raw.slice(idx,idx+qn.length);
      frag.appendChild(m);marks.push(m);pos=idx+qn.length;
    }
    if(pos<raw.length)frag.appendChild(document.createTextNode(raw.slice(pos)));
    box.appendChild(frag);mo.takeRecords();busy=false;
    if(marks.length)go(0);else cnt.textContent='0 of 0';
  }
  function go(i){
    if(!marks.length)return;
    if(cur>=0)marks[cur].classList.remove('cur');
    cur=(i+marks.length)%marks.length;marks[cur].classList.add('cur');
    cnt.textContent=(cur+1)+' of '+marks.length;
    marks[cur].scrollIntoView({block:'center',behavior:'smooth'});
  }
  mo=new MutationObserver(function(){if(busy)return;if(box.querySelector('.loading'))return;prep();if(inp.value)render();});mo.observe(box,{childList:true,characterData:true,subtree:true});
  if(!box.querySelector('.loading'))prep();
  var t;inp.addEventListener('input',function(){clearTimeout(t);t=setTimeout(render,200);});
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();clearTimeout(t);if(inp.value!==lastQ)render();else go(e.shiftKey?cur-1:cur+1);}else if(e.key==='Escape'){inp.value='';render();}});
  document.getElementById('csNext').onclick=function(){go(cur+1);};
  document.getElementById('csPrev').onclick=function(){go(cur-1);};
  document.getElementById('csClr').onclick=function(){inp.value='';render();inp.focus();};
})();
</script>
<script data-goatcounter="https://uracrom.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
