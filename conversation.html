<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Titanium Brothers</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap');
  :root{--void:#0A0A0F;--deep:#12121A;--border:#2A2A3E;--text:#D4D0C8;--dim:#6B6880;--accent:#C9923A;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--void);color:var(--text);font-family:'EB Garamond',Georgia,serif;font-size:17px;line-height:1.7;}
  header{border-bottom:1px solid var(--border);padding:24px 40px;}
  .back{font-family:'Space Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim);text-decoration:none;}
  .back:hover{color:var(--accent);}
  .site-name{font-family:'EB Garamond',serif;font-size:18px;font-style:italic;color:#fff;margin-top:4px;}
  .site-name span{color:var(--accent);font-style:normal;}
  main{max-width:720px;margin:0 auto;padding:40px 40px 100px;}
  .meta{font-family:'Space Mono',monospace;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;display:flex;gap:16px;flex-wrap:wrap;}
  h1.title{font-family:'EB Garamond',serif;font-size:clamp(26px,4vw,40px);font-weight:400;color:#fff;margin-bottom:28px;line-height:1.2;}
  .content{font-size:16px;line-height:1.8;}
  .content p{margin-bottom:1em;}
  .content strong{color:#fff;}
  .content h2,.content h3{font-family:'EB Garamond',serif;font-weight:600;color:#fff;margin:1.5em 0 0.5em;}
  .content blockquote{border-left:2px solid var(--accent);padding-left:16px;color:var(--dim);margin:1em 0;}
  .content pre{background:var(--deep);border:1px solid var(--border);padding:16px;overflow-x:auto;font-family:'Space Mono',monospace;font-size:13px;margin:1em 0;}
  .content code{font-family:'Space Mono',monospace;font-size:13px;background:var(--deep);padding:2px 5px;}
  .content pre code{background:none;padding:0;}
  .loading{color:var(--dim);font-style:italic;padding:60px 0;text-align:center;}
  .error{color:#E07B7B;padding:40px 0;}
  .raw-link{display:inline-block;margin-top:32px;font-family:'Space Mono',monospace;font-size:11px;color:var(--dim);text-decoration:none;letter-spacing:1px;text-transform:uppercase;border-bottom:1px solid var(--border);padding-bottom:2px;}
  .raw-link:hover{color:var(--accent);border-color:var(--accent);}
  @media(max-width:600px){header,main{padding-left:20px;padding-right:20px;}}
</style>
</head>
<body>
<header>
  <a class="back" href="/">← All Conversations</a>
  <div class="site-name">My Titanium <span>Brothers</span></div>
</header>
<main id="main"><div class="loading">Loading…</div></main>
<script>
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const slug = window.location.pathname.replace(/^\/conversations\//,'').replace(/\/$/,'');
if(!slug){ document.getElementById('main').innerHTML='<div class="error">No conversation specified.</div>'; }
else {
  const mdUrl = `/conversations/${slug}.md`;
  fetch(mdUrl)
    .then(r=>r.ok?r.text():Promise.reject(r.status))
    .then(raw=>{
      const fmMatch = raw.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
      let fm = {};
      let body = raw;
      if(fmMatch){
        const fmText = fmMatch[1];
        body = fmMatch[2].trim();
        fmText.split('\n').forEach(line=>{
          const m=line.match(/^(\w+):\s*"?(.+?)"?\s*$/);
          if(m) fm[m[1]]=m[2];
        });
      }
      document.title = (fm.title||slug) + ' — My Titanium Brothers';
      document.getElementById('main').innerHTML=`
        <div class="meta">
          <span>${esc(fm.ai||'')}</span>
          <span>${esc(fm.date||'')}</span>
        </div>
        <h1 class="title">${esc(fm.title||slug)}</h1>
        <div class="content">${marked.parse(body)}</div>
        <a class="raw-link" href="${esc(mdUrl)}">View raw Markdown ↗</a>
      `;
    })
    .catch(()=>{
      document.getElementById('main').innerHTML='<div class="error">Conversation not found.</div>';
    });
}
</script>
</body>
</html>
